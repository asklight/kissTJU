<html>
<head>
    <meta charset="utf-8" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", "Segoe UI", Arial, sans-serif;
        }

        body {
            width: 320px;
            background: #f3f6fb;
            color: #243447;
            max-height: 600px;
            overflow-y: auto;
            height: auto;
            min-height: 80px;
            scrollbar-width: thin;
            scrollbar-color: #b8c8da transparent;
        }

        body::-webkit-scrollbar {
            width: 6px;
        }

        body::-webkit-scrollbar-thumb {
            background: #b8c8da;
            border-radius: 6px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 2;
            background: linear-gradient(135deg, #23558e, #347eb8);
            color: white;
            padding: 13px 12px;
            font-size: 16px;
            text-align: center;
            font-weight: 700;
            letter-spacing: .5px;
            box-shadow: 0 2px 8px rgba(35, 85, 142, .22);
        }

        .content {
            padding: 10px;
        }

        .note {
            font-size: 11px;
            color: #607286;
            text-align: center;
            margin-bottom: 9px;
            padding: 6px 8px;
            background: #eaf2fb;
            border: 1px solid #d8e5f2;
            border-radius: 6px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .category-divider {
            height: 1px;
            background: #dbe4ee;
            margin: 3px 4px;
        }

        .link-item {
            display: flex;
            align-items: center;
            min-height: 38px;
            padding: 7px 10px;
            background: #fff;
            border: 1px solid #e2eaf2;
            border-radius: 8px;
            box-shadow: 0 1px 3px rgba(35, 65, 95, .06);
            transition: background .15s ease, border-color .15s ease, transform .15s ease, box-shadow .15s ease;
            flex-wrap: wrap;
        }

        .link-item:hover {
            background: #f8fbff;
            border-color: #a9c8e5;
            box-shadow: 0 3px 9px rgba(46, 106, 158, .13);
            transform: translateY(-1px);
        }

        .link-item a {
            color: #263b50;
            text-decoration: none;
            transition: color .15s ease;
            margin-right: 5px;
            flex: 1;
            font-size: 13px;
            line-height: 20px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .link-item a:hover {
            color: #2167a5;
        }

        .link-icon {
            width: 24px;
            margin-right: 7px;
            font-size: 15px;
            line-height: 20px;
            text-align: center;
            flex-shrink: 0;
            cursor: default;
            transition: transform .2s ease;
        }

        .link-icon[data-control] {
            cursor: pointer;
        }

        .link-icon.active {
            transform: rotate(90deg);
        }

        .same-row {
            display: flex;
            align-items: center;
            flex: 1;
            min-width: 0;
            gap: 4px;
        }

        .main-site {
            font-size: 13px;
            flex: 1 1 auto;
        }

        .backup-site {
            font-size: 11px;
            flex: 0 0 auto !important;
            text-align: right;
        }

        .separator {
            color: #a9b7c5;
            font-size: 11px;
        }

        .controls {
            width: 100%;
            display: none;
            flex-wrap: wrap;
            gap: 5px;
            margin: 7px 0 0 31px;
            padding-top: 7px;
            border-top: 1px solid #e7eef5;
            max-height: 0;
            overflow: hidden;
            transition: max-height .25s ease;
        }

        .controls.show {
            display: flex;
            max-height: 300px;
        }

        .control-item {
            display: flex;
            align-items: center;
            min-height: 25px;
            padding: 3px 5px;
            font-size: 11px;
            color: #526579;
            background: #f6f9fc;
            border: 1px solid #e4edf5;
            border-radius: 5px;
            gap: 4px;
            width: calc(50% - 3px);
        }

        .control-item input[type="checkbox"] {
            width: 13px;
            height: 13px;
            accent-color: #2e73ad;
        }
    </style>
</head>

<body>
    <div class="header">天大常用服务导航</div>
    <div class="content">
        <div class="note">(刷新生效)</div>
        <div class="links">
            <!-- 图书馆选座 -->
            <div class="link-item">
                <span class="link-icon">📚</span>
                <a id="link_libSet" href="https://seatw.lib.tju.edu.cn/index.php/reserve/index.html">图书馆选座</a>
            </div>

            <div class="link-item">
                <span class="link-icon">🏛️</span>
                <a id="link_lib" href="http://www.lib.tju.edu.cn/">图书馆主页</a>
            </div>
            
            <!-- 教育教学信息主站 -->
            <div class="link-item">
                <span class="link-icon" data-control="classes-controls">📖</span>
                <div class="same-row">
                    <a id="link_classes" href="http://classes.tju.edu.cn/" class="main-site">选课网主站</a>
                    <span class="separator">|</span>
                    <a id="link_saa" href="http://saa.tju.edu.cn/" class="backup-site">备用站</a>
                </div>
                <div id="classes-controls" class="controls">
                    <label class="control-item"><input type="checkbox" class="testF" id="classes-s1" value="0">自动评教</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="classes-s2" value="0">培养计划表头固定</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="classes-s3" value="0">移除底栏</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="classes-s4" value="0">课表功能增强</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="classes-s5" value="0">计算加权</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="classes-s7" value="0">实验选课增强</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="classes-s8" value="0">子网页功能增强</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="classes-s9" value="0">开课课表查看</label>
                </div>
            </div>

            <!-- 毕业论文管理 -->
            <div class="link-item">
                <span class="link-icon" data-control="thesis-controls">📑</span>
                <a id="link_thesis" href="http://121.193.132.43/thesis/">毕业论文管理</a>
                <div id="thesis-controls" class="controls">
                    <label class="control-item"><input type="checkbox" class="testF" id="thesis-s1" value="0">已阅读</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="thesis-s2" value="0">自动登录</label>
                </div>
            </div>

            <div class="link-item"><a id="link_party" href="https://party.twt.edu.cn/"><span class="link-icon">🚩</span>天大党建</a></div>
            <div class="link-item"><a id="link_zongce" href="http://172.31.126.2/"><span class="link-icon">📊</span>综测评价系统</a></div>

            <!-- 融合门户 -->
            <div class="link-item">
                <span class="link-icon" data-control="sso-controls">🔐</span>
                <a id="link_sso" href="https://sso.tju.edu.cn/">融合门户</a>
                <div id="sso-controls" class="controls">
                    <label class="control-item"><input type="checkbox" class="testF" id="sso-s3" value="0">自动填验证码</label>
                    <label class="control-item"><input type="checkbox" class="testF" id="sso-s4" value="0">强密码</label>
                </div>
            </div>

            <div class="category-divider"></div>
            <div class="link-item"><a id="link_cstjuse" href="https://cs.tjuse.com/"><span class="link-icon">📚</span>课程共享计划</a></div>
            <div class="link-item"><a id="link_xufang" href="http://172.28.45.56/"><span class="link-icon">🎮</span>虚拟仿真平台</a></div>
            <div class="link-item"><a id="link_zidongceping" href="http://39.101.72.13/"><span class="link-icon">🤖</span>自动测评平台</a></div>
            <div class="category-divider"></div>
            <div class="link-item"><a id="link_mooc" href="https://www.icourse163.org/"><span class="link-icon">🎓</span>中国大学MOOC</a></div>
            <div class="link-item"><a id="link_zhihuishu" href="https://onlineweb.zhihuishu.com/"><span class="link-icon">🌳</span>智慧树</a></div>
            <div class="link-item"><a id="link_xuexitong" href="https://i.chaoxing.com/"><span class="link-icon">📚</span>超星学习通</a></div>
            <div class="link-item"><a id="link_yuclass" href="https://changjiang.yuketang.cn/"><span class="link-icon">🌧️</span>长江雨课堂</a></div>
            <div class="category-divider"></div>
            <div class="link-item"><a id="link_cet" href="https://cet.neea.edu.cn/"><span class="link-icon">📝</span>CET四六级</a></div>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
